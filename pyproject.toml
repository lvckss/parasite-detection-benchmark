[project]
name = "parasite-detection-benchmark"
version = "0.1.0"
description = "Compare Faster R-CNN v2 and YOLOv10-S on parasites-1s07h."
requires-python = ">=3.11,<3.13"
dependencies = [
    "anywidget>=0.9,<1",
    "ipykernel>=6.29,<8",
    "ipywidgets>=8.1,<9",
    "jupyterlab>=4.3,<5",
    "matplotlib>=3.9,<4",
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "pillow>=11,<14",
    "pyarrow>=18,<24",
    "pycocotools>=2.0.8,<3",
    "pyyaml>=6,<7",
    "tqdm>=4.67,<5",
    "ultralytics>=8.3,<9",
]

[project.optional-dependencies]
cpu = ["torch==2.8.0", "torchvision==0.23.0"]
cu128 = ["torch==2.8.0", "torchvision==0.23.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/parasite_detection"]

[tool.uv]
conflicts = [[{ extra = "cpu" }, { extra = "cu128" }]]

[tool.uv.sources]
torch = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]
torchvision = [
    { index = "pytorch-cpu", extra = "cpu", marker = "sys_platform != 'darwin'" },
    { index = "pytorch-cu128", extra = "cu128", marker = "sys_platform != 'darwin'" },
]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true
